name: Mobile Visual Regression CI

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
  # Triggered by workflow dispatch or repository dispatch when katapp-app finishes building
  repository_dispatch:
    types: [ katapp_build_completed ]

jobs:
  visual-regression-test:
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # needed to download the screenshots of the previous run

    steps:
      - name: 1. Checkout test suite repository
        uses: actions/checkout@v4

      # Identify the upstream KatApp build: from the dispatch payload, otherwise the latest successful build run
      - name: 2a. Resolve upstream katapp build
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.AUTO_SCREEN_TRIGGER_PAT }}
          KATAPP_REPO: kat-app/katapp-app
          DISPATCH_RUN_ID: ${{ github.event.client_payload.run_id }}
          DISPATCH_SHA: ${{ github.event.client_payload.commit_sha }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          if [ -n "$DISPATCH_RUN_ID" ]; then
            printf 'run_id=%s\nsha=%s\nbranch=%s\n' "$DISPATCH_RUN_ID" "$DISPATCH_SHA" "$DISPATCH_BRANCH" >> "$GITHUB_OUTPUT"
            echo "📥 Upstream build from dispatch: run $DISPATCH_RUN_ID, commit $DISPATCH_SHA"
          else
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$KATAPP_REPO/actions/workflows/build_and_trigger_test.yml/runs?status=success&per_page=1" \
              -o upstream_runs.json || true
            python3 - <<'EOF'
          import json, os
          try:
              runs = json.load(open("upstream_runs.json")).get("workflow_runs") or []
          except Exception:
              runs = []
          run = runs[0] if runs else {}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run_id={run.get('id', '')}\nsha={run.get('head_sha', '')}\nbranch={run.get('head_branch', '')}\n")
          print(f"📥 Latest upstream build: run {run.get('id', '-')}, commit {run.get('head_sha', '-')}")
          EOF
          fi

      # Replaces 'gh run download' (gh is not installed on the runner)
      - name: 2b. Download upstream katapp build artifact
        if: steps.upstream.outputs.run_id != ''
        continue-on-error: true  # e.g. expired artifact (retention 1 day); step 3 then uses the local build
        uses: actions/download-artifact@v4
        with:
          name: katapp-runner-app
          path: app_bundle
          repository: kat-app/katapp-app
          run-id: ${{ steps.upstream.outputs.run_id }}
          github-token: ${{ secrets.AUTO_SCREEN_TRIGGER_PAT }}

      # The identity of the app build decides which screenshots serve as baseline for the version comparison:
      # the upstream commit SHA, or for a local build the hash of the app binary.
      - name: 3. Extract target application bundle and record its identity
        id: app
        env:
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          SOURCE=local
          if [ -f "./app_bundle/katapp-runner.zip" ]; then
            mkdir -p build/ios/iphonesimulator
            unzip -q -o ./app_bundle/katapp-runner.zip -d build/ios/iphonesimulator/
            SOURCE=upstream
            echo "✅ Upstream build extracted to build/ios/iphonesimulator/Runner.app"
          elif [ -d "/Users/taylorzhuang/Masterarbeit/katapp-app/katapp-app/build/ios/iphonesimulator/Runner.app" ]; then
            mkdir -p build/ios/iphonesimulator
            rsync -a /Users/taylorzhuang/Masterarbeit/katapp-app/katapp-app/build/ios/iphonesimulator/Runner.app build/ios/iphonesimulator/
            echo "✅ Local build synced to build/ios/iphonesimulator/Runner.app"
          else
            echo "⚠️ No katapp-runner.zip found and no local fallback build"
          fi
          APP_SOURCE="$SOURCE" python3 - <<'EOF'
          import hashlib, json, os, plistlib
          app = "build/ios/iphonesimulator/Runner.app"
          info = {"source": os.environ["APP_SOURCE"]}
          binary = os.path.join(app, "Runner")
          if os.path.exists(binary):
              info["binary_sha256"] = hashlib.sha256(open(binary, "rb").read()).hexdigest()
          plist = os.path.join(app, "Info.plist")
          if os.path.exists(plist):
              p = plistlib.load(open(plist, "rb"))
              info["version"] = p.get("CFBundleShortVersionString")
              info["build"] = p.get("CFBundleVersion")
          if info["source"] == "upstream":
              info["commit_sha"] = os.environ.get("UPSTREAM_SHA", "")
              info["branch"] = os.environ.get("UPSTREAM_BRANCH", "")
              info["run_id"] = os.environ.get("UPSTREAM_RUN_ID", "")
          sha = info.get("commit_sha") or ""
          info["identity"] = sha[:12] if sha else "local-" + info.get("binary_sha256", "unknown")[:12]
          json.dump(info, open("app_build.json", "w"), indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"identity={info['identity']}\n")
          print(json.dumps(info, indent=2))
          EOF

      - name: 4. Verify Python environment
        run: |
          python3 --version
          python3 -m pip --version

      - name: 5. Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      # Use the local Qwen3-VL-4B-V2 weights (same model as the experiments).
      # The Hugging Face repo Auto-Screen-Qwen3-VL-Agent holds an older model and is not used here.
      - name: 6. Prepare fine-tuned Qwen model
        run: |
          mkdir -p Qwen_trained
          if [ -d "/Users/taylorzhuang/Auto-Screen/Qwen_trained/Qwen3-VL-4B-V2" ] && [ ! -d "Qwen_trained/Qwen3-VL-4B-V2" ]; then
            echo "⚡ Linking local model from /Users/taylorzhuang/Auto-Screen/Qwen_trained/Qwen3-VL-4B-V2..."
            ln -s /Users/taylorzhuang/Auto-Screen/Qwen_trained/Qwen3-VL-4B-V2 Qwen_trained/Qwen3-VL-4B-V2
          fi
          if [ ! -d "Qwen_trained/Qwen3-VL-4B-V2" ]; then
            echo "::error::Qwen_trained/Qwen3-VL-4B-V2 not found. No fallback model is used."
            exit 1
          fi
          echo "✅ Qwen model weights ready in Qwen_trained/Qwen3-VL-4B-V2"

      - name: 7. Verify Appium and XCUITest setup
        run: |
          if ! command -v appium &> /dev/null; then
            npm install -g appium
            appium driver install xcuitest
          fi
          echo "✅ Appium environment is ready"

      # Version comparison: the baseline is the newest screenshots artifact of a different app build on this branch.
      # Artifacts are named screenshots-<identity>, so a rerun of the same build is compared with the previous build.
      - name: 8a. Find the baseline screenshots of the previous app build
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ID: ${{ steps.app.outputs.identity }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -o artifacts.json || true
          python3 - <<'EOF'
          import json, os
          try:
              artifacts = json.load(open("artifacts.json")).get("artifacts") or []
          except Exception:
              artifacts = []
          current, branch = os.environ["CURRENT_ID"], os.environ["BRANCH"]
          candidates = [
              a for a in artifacts
              if a["name"].startswith("screenshots-") and not a.get("expired")
              and (a.get("workflow_run") or {}).get("head_branch") == branch
              and a["name"] != f"screenshots-{current}"
          ]
          candidates.sort(key=lambda a: a["created_at"], reverse=True)
          best = candidates[0] if candidates else None
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run_id={best['workflow_run']['id'] if best else ''}\n")
              out.write(f"name={best['name'] if best else ''}\n")
              out.write(f"identity={best['name'][len('screenshots-'):] if best else ''}\n")
          if best:
              print(f"📥 Baseline: {best['name']} from run {best['workflow_run']['id']} (current build: {current})")
          else:
              print(f"ℹ️ No screenshots of a different app build found (current build: {current}), the version comparison is skipped")
          EOF

      - name: 8b. Download the baseline screenshots
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.name }}
          path: previous_screenshots
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 8. Execute visual regression testing pipeline
        env:
          CURRENT_APP_ID: ${{ steps.app.outputs.identity }}
          PREVIOUS_APP_ID: ${{ steps.previous.outputs.identity }}
        run: |
          chmod +x run_pipeline_local.sh
          if [ -d previous_screenshots ] && [ -n "$(ls -A previous_screenshots)" ]; then
            export PREVIOUS_SCREENSHOTS="$PWD/previous_screenshots"
            echo "🔁 Version comparison enabled: $PREVIOUS_APP_ID -> $CURRENT_APP_ID"
          fi
          ./run_pipeline_local.sh

      - name: 9. Upload visual quality reports and diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            diff_results/
            Qwen_trained/screenshots/
            app_build.json

      # Baseline for the version comparison of later runs (only from successful runs), named by app build
      - name: 10. Upload screenshots as baseline for later runs
        if: success()
        run: cp app_build.json Qwen_trained/screenshots/app_build.json

      - name: 11. Upload screenshots artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ steps.app.outputs.identity }}
          path: Qwen_trained/screenshots/
