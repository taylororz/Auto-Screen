name: Mobile Visual Regression CI

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
  # Triggered by workflow dispatch or repository dispatch when katapp-app finishes building
  repository_dispatch:
    types: [ katapp_build_completed ]

jobs:
  visual-regression-test:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: 1. Checkout test suite repository
        uses: actions/checkout@v4

      # Download Runner.app artifact from katapp-app (supports repository_dispatch, workflow_dispatch, and push)
      - name: 2. Download upstream katapp build artifact
        env:
          GH_TOKEN: ${{ secrets.AUTO_SCREEN_TRIGGER_PAT }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          mkdir -p ./app_bundle
          if [ -n "$DISPATCH_RUN_ID" ]; then
            echo "📥 Fetching artifact from dispatched upstream run: $DISPATCH_RUN_ID"
            gh run download "$DISPATCH_RUN_ID" --repo kat-app/katapp-app --name katapp-runner-app --dir ./app_bundle || true
          else
            echo "📥 Fetching latest successful build artifact from kat-app/katapp-app"
            gh run download --repo kat-app/katapp-app --name katapp-runner-app --dir ./app_bundle || true
          fi

      - name: 3. Extract target application bundle
        run: |
          if [ -f "./app_bundle/katapp-runner.zip" ]; then
            mkdir -p build/ios/iphonesimulator
            unzip -q -o ./app_bundle/katapp-runner.zip -d build/ios/iphonesimulator/
            echo "✅ Latest build extracted to build/ios/iphonesimulator/Runner.app"
          elif [ -d "/Users/taylorzhuang/Masterarbeit/katapp-app/katapp-app/build/ios/iphonesimulator/Runner.app" ]; then
            mkdir -p build/ios/iphonesimulator
            rsync -a /Users/taylorzhuang/Masterarbeit/katapp-app/katapp-app/build/ios/iphonesimulator/Runner.app build/ios/iphonesimulator/
            echo "✅ Local build synced to build/ios/iphonesimulator/Runner.app"
          else
            echo "⚠️ No katapp-runner.zip found and no local fallback build"
          fi

      - name: 4. Verify Python environment
        run: |
          python3 --version
          python3 -m pip --version

      - name: 5. Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      # Use local fine-tuned Qwen weights if available, otherwise download from Hugging Face
      - name: 6. Prepare fine-tuned Qwen model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p Qwen_trained
          if [ -d "/Users/taylorzhuang/Auto-Screen/Qwen_trained/Katapp-Qwen3-VL-Agent" ] && [ ! -d "Qwen_trained/Katapp-Qwen3-VL-Agent" ]; then
            echo "⚡ Linking local model from /Users/taylorzhuang/Auto-Screen/Qwen_trained/Katapp-Qwen3-VL-Agent..."
            ln -s /Users/taylorzhuang/Auto-Screen/Qwen_trained/Katapp-Qwen3-VL-Agent Qwen_trained/Katapp-Qwen3-VL-Agent
          elif [ ! -d "Qwen_trained/Katapp-Qwen3-VL-Agent" ]; then
            git lfs install
            if [ -n "$HF_TOKEN" ]; then
              git config --global credential.helper store
              echo "https://user:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
            fi
            echo "📥 Cloning fine-tuned Qwen model from Hugging Face..."
            git clone https://huggingface.co/Taylororz/Auto-Screen-Qwen3-VL-Agent Qwen_trained/Katapp-Qwen3-VL-Agent
          fi
          echo "✅ Qwen model weights ready in Qwen_trained/Katapp-Qwen3-VL-Agent!"

      - name: 7. Verify Appium and XCUITest setup
        run: |
          if ! command -v appium &> /dev/null; then
            npm install -g appium
            appium driver install xcuitest
          fi
          echo "✅ Appium environment is ready"

      - name: 8. Execute visual regression testing pipeline
        run: |
          chmod +x run_pipeline_local.sh
          ./run_pipeline_local.sh

      - name: 9. Upload visual quality reports and diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            diff_results/
            screenshots/
